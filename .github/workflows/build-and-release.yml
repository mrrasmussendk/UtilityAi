name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub release and publish to NuGet'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      is_new_version: ${{ steps.get_version.outputs.IS_NEW_VERSION }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for GitVersion

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build (update documentation)
      run: dotnet build --no-restore --configuration Release /p:GenerateDocumentationFile=true

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Trigger documentation agent
      uses: actions/github-script@v7
      with:
        script: |
          const message = `@copilot Please update repository documentation based on the latest build and tests for commit ${context.sha}.`;
          if (context.eventName === "pull_request") {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: message
            });
            return;
          }

          const issueTitle = "Automated documentation update";
          const existing = await github.rest.search.issuesAndPullRequests({
            q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${issueTitle}"`
          });

          const issueNumber = existing.data.items[0]?.number ?? (await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: issueTitle,
            body: "Used by CI to request documentation updates from @copilot after each build."
          })).data.number;

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: issueNumber,
            body: message
          });

    - name: Determine version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          echo "IS_NEW_VERSION=false" >> $GITHUB_OUTPUT
          echo "Using manual version: ${{ inputs.version }}"
        elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IS_NEW_VERSION=false" >> $GITHUB_OUTPUT
          echo "Using tag version: $VERSION"
        else
          # Use version from csproj
          VERSION=$(grep -oP '<Version>\K[^<]+' ./src/UtilityAi/UtilityAi.csproj)
          # Check if this version already has a tag (auto-release detection)
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ] && ! git tag -l "v$VERSION" | grep -q .; then
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "IS_NEW_VERSION=true" >> $GITHUB_OUTPUT
            echo "New version detected: $VERSION - will auto-release"
          else
            echo "VERSION=$VERSION-preview.$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
            echo "IS_NEW_VERSION=false" >> $GITHUB_OUTPUT
            echo "Using preview version: $VERSION-preview.$(date +%Y%m%d%H%M%S)"
          fi
        fi

    - name: Pack UtilityAi
      if: github.event_name != 'pull_request'
      run: dotnet pack ./src/UtilityAi/UtilityAi.csproj --configuration Release --no-build --output ./artifacts /p:Version=${{ steps.get_version.outputs.VERSION }}

    - name: Pack UtilityAi.Maf
      if: github.event_name != 'pull_request'
      run: dotnet pack ./integrations/UtilityAi.Maf/UtilityAi.Maf.csproj --configuration Release --no-build --output ./artifacts /p:Version=${{ steps.get_version.outputs.VERSION }}

    - name: Upload artifacts
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg

  release:
    needs: build
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release == true) ||
      needs.build.outputs.is_new_version == 'true'

    steps:
    - uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts

    - name: Create tag for auto-release
      if: needs.build.outputs.is_new_version == 'true'
      run: |
        git tag "v${{ needs.build.outputs.version }}"
        git push origin "v${{ needs.build.outputs.version }}"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.build.outputs.version }}
        files: ./artifacts/*.nupkg
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
